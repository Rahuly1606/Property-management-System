---
# Ansible Playbook for Property Management System Deployment
# This playbook deploys the PMS application using Docker and Docker Compose

- name: Deploy Property Management System
  hosts: all
  become: yes
  vars:
    app_name: pms
    app_dir: /opt/pms
    docker_compose_version: "2.23.0"
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('Rahul@1606', true) }}"
    mysql_database: pmsbackend
    backend_port: 8082
    frontend_port: 80
  
  tasks:
    # Pre-deployment checks
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install required packages
      package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    # Docker Installation
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker
      package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # Docker Compose Installation
    - name: Download Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: docker_compose_version_output
      changed_when: false

    - name: Display Docker Compose version
      debug:
        msg: "{{ docker_compose_version_output.stdout }}"

    # Application Deployment
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy application files
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=target"
          - "--exclude=.idea"
          - "--exclude=.vscode"

    - name: Create .env file from template
      template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Stop existing containers
      command: docker-compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    - name: Remove old images
      command: docker system prune -af --volumes
      args:
        chdir: "{{ app_dir }}"
      when: clean_deployment | default(false)

    - name: Build and start Docker containers
      command: docker-compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      register: docker_compose_up
      retries: 3
      delay: 10
      until: docker_compose_up.rc == 0

    - name: Wait for MySQL to be ready
      wait_for:
        host: localhost
        port: 3307
        delay: 10
        timeout: 120
        state: started

    - name: Wait for Backend to be ready
      wait_for:
        host: localhost
        port: "{{ backend_port }}"
        delay: 15
        timeout: 180
        state: started

    - name: Wait for Frontend to be ready
      wait_for:
        host: localhost
        port: "{{ frontend_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Check container status
      command: docker-compose ps
      args:
        chdir: "{{ app_dir }}"
      register: container_status

    - name: Display container status
      debug:
        msg: "{{ container_status.stdout_lines }}"

    # Health Checks
    - name: Check backend health
      uri:
        url: "http://localhost:{{ backend_port }}/actuator/health"
        method: GET
        status_code: 200
      register: backend_health
      retries: 5
      delay: 10
      until: backend_health.status == 200
      ignore_errors: yes

    - name: Check frontend health
      uri:
        url: "http://localhost:{{ frontend_port }}/"
        method: GET
        status_code: 200
      register: frontend_health
      retries: 3
      delay: 5
      until: frontend_health.status == 200
      ignore_errors: yes

    - name: Display deployment summary
      debug:
        msg:
          - "==================================================="
          - "Property Management System Deployment Complete!"
          - "==================================================="
          - "Frontend URL: http://{{ ansible_host }}:{{ frontend_port }}"
          - "Backend URL: http://{{ ansible_host }}:{{ backend_port }}"
          - "MySQL Port: 3307"
          - "==================================================="
          - "Backend Health: {{ 'OK' if backend_health.status == 200 else 'FAILED' }}"
          - "Frontend Health: {{ 'OK' if frontend_health.status == 200 else 'FAILED' }}"
          - "==================================================="

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted
